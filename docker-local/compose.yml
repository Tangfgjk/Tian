name: tianji-local

services:
  mysql:
    image: mysql:8.0.29
    container_name: tianji-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - tianji-net

  redis:
    image: redis:7.0.0
    container_name: tianji-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - tianji-net

  nacos:
    image: nacos/nacos-server:v2.1.0
    container_name: tianji-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "127.0.0.1:${NACOS_HTTP_PORT:-8848}:8848"
      - "127.0.0.1:${NACOS_GRPC_PORT:-9848}:9848"
      - "127.0.0.1:${NACOS_GRPC_TLS_PORT:-9849}:9849"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    networks:
      - tianji-net

  rabbitmq:
    image: rabbitmq:3.8-management
    container_name: tianji-rabbitmq
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - tianji-net

  # ============ 扩展中间件 ============

  # RocketMQ NameServer（项目文档指定 4.9.6）
  rmqnamesrv:
    image: apache/rocketmq:4.9.6
    container_name: tianji-rmqnamesrv
    restart: unless-stopped
    environment:
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m -Xmn128m"
    ports:
      - "127.0.0.1:${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    volumes:
      - rmqnamesrv-logs:/home/rocketmq/logs
    command: ["sh", "mqnamesrv"]
    networks:
      - tianji-net

  # RocketMQ Broker（brokerIP1=127.0.0.1，客户端在宿主机）
  rmqbroker:
    image: apache/rocketmq:4.9.6
    container_name: tianji-rmqbroker
    restart: unless-stopped
    depends_on:
      - rmqnamesrv
    environment:
      NAMESRV_ADDR: tianji-rmqnamesrv:9876
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m -Xmn256m"
    ports:
      - "127.0.0.1:${ROCKETMQ_BROKER_PORT:-10911}:10911"
      - "127.0.0.1:10909:10909"
      - "127.0.0.1:10912:10912"
    volumes:
      - ./broker.conf:/home/rocketmq/rocketmq-4.9.6/conf/broker.conf
      - rmqbroker-logs:/home/rocketmq/logs
      # store 用宿主机目录绑定挂载（命名卷在 Docker Desktop 上会导致 broker 启动即退出 253）
      - ./rocketmq-store:/home/rocketmq/store
    command: ["sh", "mqbroker", "-c", "/home/rocketmq/rocketmq-4.9.6/conf/broker.conf"]
    networks:
      - tianji-net

  # MinIO（项目文档固定版本，账号与 tj-media bootstrap.yml 一致）
  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: tianji-minio
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123456
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - tianji-net

  # XXL-Job 调度中心 2.3.1（accessToken 与 nacos shared-xxljob.yaml 一致）
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.3.1
    container_name: tianji-xxl-job-admin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PARAMS: "--spring.datasource.url=jdbc:mysql://tianji-mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false --spring.datasource.username=root --spring.datasource.password=${MYSQL_ROOT_PASSWORD} --xxl.job.accessToken=tianji"
    ports:
      - "127.0.0.1:${XXL_JOB_PORT:-8880}:8080"
    networks:
      - tianji-net

  # Seata Server 1.5.2（注册进 Nacos 命名空间 c975b6f4，与 shared-seata.yaml 一致）
  seata-server:
    image: seataio/seata-server:1.5.2
    container_name: tianji-seata-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SEATA_IP: 127.0.0.1
      SEATA_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${SEATA_PORT:-8091}:8091"
      - "127.0.0.1:7091:7091"
    volumes:
      - ./seata/application.yml:/seata-server/resources/application.yml
    networks:
      - tianji-net

networks:
  tianji-net:
    name: tianji-local-net

volumes:
  mysql-data:
    name: tianji-mysql-data
  redis-data:
    name: tianji-redis-data
  nacos-data:
    name: tianji-nacos-data
  nacos-logs:
    name: tianji-nacos-logs
  rabbitmq-data:
    name: tianji-rabbitmq-data
  rmqnamesrv-logs:
    name: tianji-rmqnamesrv-logs
  rmqbroker-logs:
    name: tianji-rmqbroker-logs
  minio-data:
    name: tianji-minio-data
